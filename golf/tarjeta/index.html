<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d3b2e">
<title>Tarjeta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏌️</text></svg>">
<style>
  :root{ color-scheme: light;
    --ink:#14181b; --mid:#59626a; --light:#8a929a; --line:#e3e7ea;
    --paper:#fff; --wash:#f4f1e8;
    --green:#0d3b2e; --green2:#14533f; --fair:#2f8a5b; --fair2:#3fa56d;
    --serif:'Iowan Old Style',Palatino,Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif; }
  *{box-sizing:border-box}
  html,body{overflow-x:hidden}
  body{margin:0;background:var(--wash);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;
       -webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
  button{font:inherit;cursor:pointer;color:inherit}
  a{color:inherit}
  .num{font-variant-numeric:tabular-nums}

  .bar{background:repeating-linear-gradient(90deg,var(--green) 0 60px,#0f4233 60px 120px);color:#fff;padding:14px 16px}
  .bar .in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{font-family:var(--serif);font-size:19px;text-decoration:none;white-space:nowrap}
  .brand span{opacity:.5}
  .conn{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;padding:4px 9px;border-radius:99px;
        background:rgba(255,255,255,.10);color:rgba(255,255,255,.75);white-space:nowrap}
  .conn.live::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:#6ee7a0;
        margin-right:6px;vertical-align:1px;box-shadow:0 0 0 3px rgba(110,231,160,.25)}
  .conn.down{background:rgba(255,120,100,.2);color:#ffd2c8}

  main{max-width:760px;margin:0 auto;padding:18px 16px 90px}
  h1{font-family:var(--serif);font-weight:400;font-size:30px;margin:6px 0 4px;letter-spacing:-.3px}
  h2{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--light);margin:30px 0 10px;font-weight:600}
  .sub{color:var(--mid);margin:0 0 18px;font-size:15px}
  .muted{color:var(--light)}
  .back{display:inline-block;font-size:14px;color:var(--mid);text-decoration:none;margin:0 0 6px}

  .btn{border:0;border-radius:99px;padding:13px 22px;font-weight:600;font-size:15px;background:var(--green);color:#fff;
       box-shadow:0 8px 20px rgba(13,59,46,.18)}
  .btn:active{transform:scale(.98)}
  .btn.full{width:100%;padding:16px}
  .btn.light{background:#fff;color:var(--green);border:1px solid var(--line);box-shadow:none}
  .btn.danger{background:#fff;color:#b23a22;border:1px solid #f0c7bd;box-shadow:none}
  .btn:disabled{opacity:.45;cursor:default}
  .link{border:0;background:none;padding:0;color:var(--mid);text-decoration:underline;font-size:14px}

  .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 10px;
        display:block;text-decoration:none}
  a.card:active{border-color:#bcd6d0}
  .card .t{font-weight:600}
  .card .m{font-size:14px;color:var(--mid);margin-top:2px}
  .card .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .tag{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:3px 8px;border-radius:99px;
       background:#e7f3ec;color:var(--green2);white-space:nowrap}
  .tag.done{background:#eef0f2;color:var(--mid)}
  .tag.fin{background:var(--ink);color:#fff;font-size:12px;padding:4px 10px}
  /* home */
  .agh{position:relative;border-radius:20px;overflow:hidden;margin:4px 0 8px;background:linear-gradient(#cfe6f2,#eaf4f0 55%);
       box-shadow:0 18px 40px rgba(0,58,34,.25);--ag:#006747;--agy:#fce300}
  .agh-scene{position:relative;aspect-ratio:400/170}
  .agh-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  /* the distant green is at 80% across and 27% up the drawing */
  .hole-cup{position:absolute;left:80.5%;bottom:25.8%;width:9px;height:4px;margin-left:-4.5px;border-radius:50%;background:#1d3a22}
  .flag3{position:absolute;left:80.5%;bottom:26.5%;width:2px;height:24%;background:#f4f4f4;border-radius:2px;box-shadow:0 0 0 .5px #233a26}
  .flag3 b{position:absolute;left:2px;top:0;width:18px;height:11px;background:var(--agy);clip-path:polygon(0 0,100% 50%,0 100%);
       transform-origin:left center;animation:wave3 1.4s ease-in-out infinite}
  @keyframes wave3{0%,100%{transform:scaleX(1) skewY(0)}50%{transform:scaleX(.8) skewY(5deg)}}
  /* the drive: the outer element moves across, the inner one carries the height (arc, bounce, roll, drop) */
  .shot,.shot-shadow{position:absolute;top:0;bottom:0;width:0;left:37.5%;animation:shotx 6s linear infinite}
  .shot-y{position:absolute;left:0;bottom:12%;animation:shoty 6s infinite}
  .ball3{position:absolute;left:-6px;bottom:0;width:12px;height:12px;border-radius:50%;border:1px solid #233a26;box-sizing:border-box;
       background:radial-gradient(circle at 35% 30%,#fff 0 40%,#e2e2e2 75%,#c4c4c4);animation:shotb 6s infinite}
  .shot-shadow i{position:absolute;left:-5px;bottom:11%;width:10px;height:3px;border-radius:50%;background:rgba(0,0,0,.28);animation:shots 6s infinite}
  @keyframes shotx{0%,8%{left:37.5%}45%{left:73%}58%{left:78%}70%{left:80.5%}100%{left:80.5%}}
  @keyframes shoty{0%,8%{bottom:12%;animation-timing-function:ease-out}26%{bottom:78%;animation-timing-function:ease-in}45%{bottom:27%;animation-timing-function:ease-out}
       51%{bottom:33%;animation-timing-function:ease-in}57%{bottom:27%}70%{bottom:26.5%}100%{bottom:26.5%}}
  @keyframes shotb{0%,8%{opacity:1;transform:scale(1)}45%{transform:scale(.62)}70%{opacity:1;transform:scale(.58)}74%{opacity:0;transform:translateY(3px) scale(.3)}97%{opacity:0}100%{opacity:1;transform:scale(1)}}
  @keyframes shots{0%,8%{bottom:10.5%;opacity:.9;transform:scale(1)}26%{opacity:.25}45%{bottom:25.5%;opacity:.8;transform:scale(.6)}70%{bottom:25.5%;opacity:.8;transform:scale(.55)}74%,97%{opacity:0}100%{bottom:10.5%;opacity:.9;transform:scale(1)}}
  .agh-board{position:relative;margin:-10px 14px 16px;font-family:'Oswald','Arial Narrow',sans-serif}
  .agh-arch{width:64%;margin:0 auto;background:#fff;border:3px solid var(--ag);border-bottom:0;border-radius:60px 60px 0 0/24px 24px 0 0;
       text-align:center;font-weight:700;font-size:24px;letter-spacing:4px;color:var(--ag);padding:6px 0 2px}
  .agh-body{background:#fff;border:3px solid var(--ag);border-radius:6px;padding:12px 14px 14px;text-align:center}
  .agh-body p{font-family:var(--sans);font-size:14px;color:var(--mid);margin:0 0 12px}
  .agh-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
  .agh-stats div{border:1px solid #dfe5e1;border-radius:3px;padding:6px 0 4px}
  .agh-stats b{display:block;font-size:28px;font-weight:600;line-height:1.1;color:var(--ag)}
  .agh-stats span{font-size:11px;letter-spacing:1.4px;color:#1b1d1c}
  .agh-cta{width:100%;background:var(--ag);color:#fff;font-family:'Oswald','Arial Narrow',sans-serif;letter-spacing:2px;font-size:17px;
       border-radius:4px;padding:14px;box-shadow:0 6px 0 #004d35}
  .agh-cta:active{transform:translateY(3px);box-shadow:0 3px 0 #004d35}
  @media (prefers-reduced-motion:reduce){.shot,.shot-y,.ball3,.shot-shadow,.flag3 b{animation:none}}
  .lm{font-family:var(--sans);font-weight:500;font-size:11px;color:var(--mid);letter-spacing:0;text-transform:none}
  .cmts{display:grid;gap:8px;margin-bottom:10px}
  .cmt{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .cmt-h{display:flex;gap:10px;align-items:baseline;font-size:13px}
  .cmt-h span{color:var(--light);flex:1}
  .cmt-h .link{font-size:12px}
  .cmt-t{margin-top:4px;white-space:pre-wrap;word-wrap:break-word}
  .cform{display:grid;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
  .cform textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;resize:vertical}
  .cform .btn{justify-self:end;padding:10px 20px}
  .lives{display:grid;gap:12px}
  .lcard{display:block;text-decoration:none;background:#fff;border:2px solid #d9dfdb;border-radius:6px;padding:12px 14px 8px;
        font-family:'Oswald','Arial Narrow',sans-serif;--ag:#006747;--agred:#c8102e;transition:transform .12s}
  .lcard:active{transform:scale(.99)}
  .live-top{display:flex;align-items:center;gap:8px;font-size:17px}
  .live-top b{font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#1b1d1c}
  .live-dot{width:8px;height:8px;border-radius:50%;background:#1f9d57;box-shadow:0 0 0 3px rgba(31,157,87,.2);animation:pulse 1.6s ease-in-out infinite}
  .live-h{font-size:12px;letter-spacing:1px;text-transform:uppercase;background:var(--ag);color:#fff;padding:2px 8px;border-radius:3px}
  .live-sub{font-family:var(--sans);font-size:12.5px;color:var(--mid);margin:2px 0 6px}
  .lr{display:grid;grid-template-columns:22px 1fr auto 58px;gap:8px;align-items:center;padding:5px 0;border-top:1px solid #eef1ef;font-size:16px}
  .lp{color:var(--agred);font-weight:600}
  .ln{color:var(--ag);font-weight:600;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lv{font-weight:600;font-size:18px;color:#1b1d1c}
  .lv.under{color:var(--ag)} .lv.over{color:var(--agred)}
  .lt{font-size:11px;letter-spacing:.8px;color:var(--mid);text-align:right}
  .lastres{display:flex;align-items:center;gap:14px;text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .trophy{font-size:30px;line-height:1}
  .lr-t{flex:1;min-width:0}
  .lr-t b{display:block;font-family:var(--serif);font-weight:400;font-size:20px}
  .lr-t span{font-size:13px;color:var(--mid)}
  .lastres .arw,.tiles2 .arw{color:var(--light);font-size:22px}
  .tiles2{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:28px}
  .tiles2 a{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 12px;text-decoration:none;display:flex;flex-direction:column;gap:2px}
  .tiles2 .ic{font-size:24px;margin-bottom:4px}
  .tiles2 b{font-weight:600;font-size:15px}
  .tiles2 span:last-child{font-size:12px;color:var(--mid)}
  /* match play panel */
  .mp{margin:10px 0 16px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#fff}
  .mp-head{display:grid;grid-template-columns:1fr auto 1fr;background:var(--green);color:#fff}
  .mp-side{padding:10px 12px;min-width:0}
  .mp-side:last-child{text-align:right}
  .mp-side.lead{background:#fff;color:var(--tc)}
  .mp-team{font-family:var(--serif);font-weight:400;font-size:19px;line-height:1.15}
  .mp-pl{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.95}
  .mp-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 12px;border-left:1px solid rgba(255,255,255,.15);border-right:1px solid rgba(255,255,255,.15)}
  .mp-mid b{font-family:var(--serif);font-size:26px;line-height:1.1;font-weight:400}
  .mp-mid span{font-size:11px;letter-spacing:1.2px;opacity:.8}
  .mp-note{font-size:12px;color:var(--mid);padding:6px 12px;border-bottom:1px solid var(--line)}
  .mp-t{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
  .mp-t th,.mp-t td{text-align:center;padding:6px 0;border-bottom:1px solid #f0f1f2}
  .mp-t th:first-child{width:76px;text-align:left;padding-left:10px;font-size:11.5px;line-height:1.15;overflow-wrap:anywhere}
  .mp-t thead th{background:var(--green);color:#fff;font-weight:600}
  .mp-t .sum{font-weight:800;width:46px}
  .mp-t thead .sum{font-size:11px}
  .mp-t .par td,.mp-t .par th{color:var(--mid)}
  .mp-t .st td{font-size:10px;font-weight:700;color:var(--ink)}
  .mp-t .st th{color:var(--mid)}
  .mp-s{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;color:var(--tc);font-weight:700}
  .mp-s.won{background:var(--tc);color:#fff}
  /* hole entry page in the Augusta board look */
  .aug{--ag:#006747;--agred:#c8102e;--agline:#d9dfdb}
  .aug .aug-sum{margin:10px 0 14px;font-family:'Oswald','Arial Narrow',sans-serif}
  .aug .summary{background:#fff;color:#1b1d1c;border:2px solid var(--agline);border-radius:4px;box-shadow:none;margin:0;padding:10px 14px}
  .aug .summary .big{font-family:'Oswald','Arial Narrow',sans-serif;font-weight:600;color:var(--ag);text-transform:uppercase;letter-spacing:.5px}
  .aug .summary .small{color:var(--mid);opacity:1;font-family:var(--sans)}
  .aug .lb{gap:0}
  .aug .lb .it{border-top:1px solid #eef1ef;padding:5px 0}
  .aug .lb .it:first-child{border-top:0}
  .aug .lb .pos{color:var(--agred);opacity:1;font-weight:600;font-size:16px}
  .aug .lb .it > span:nth-child(2){color:var(--ag);text-transform:uppercase;letter-spacing:.5px;font-weight:600;font-size:16px}
  .aug .lb .val{font-family:'Oswald','Arial Narrow',sans-serif;font-weight:600;font-size:22px;color:#1b1d1c}
  .aug .lb .thru{color:var(--mid);opacity:1;text-transform:uppercase;letter-spacing:.5px}
  .aug .under{color:var(--ag)!important}
  .aug .even{color:#1b1d1c!important}
  .aug .over{color:var(--agred)!important}
  .aug .strip button{border-radius:3px;border:1px solid var(--agline);background:#fff;color:#1b1d1c;width:32px;height:34px;
       font-family:'Oswald','Arial Narrow',sans-serif;font-size:15px;font-weight:500}
  .aug .strip button.done{color:var(--ag);border-color:#bcd3c5;font-weight:600}
  .aug .strip button.cur{background:var(--ag);border-color:var(--ag);color:#fff}
  .aug .hole{background:#fff;border:2px solid var(--agline);border-radius:4px;padding:8px 12px;margin:10px 0 6px;
       font-family:'Oswald','Arial Narrow',sans-serif;align-items:center}
  .aug .hole .n{font-family:'Oswald','Arial Narrow',sans-serif;font-weight:700;font-size:32px;text-transform:uppercase;letter-spacing:.5px}
  .aug .hole .meta{font-size:15px;text-transform:uppercase;letter-spacing:.8px;color:var(--mid)}
  .aug .hole .meta b{color:var(--ag);font-weight:600}
  .aug .hres{font-family:'Oswald','Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.6px;color:var(--ag);font-size:14px}
  .aug .pl{border:2px solid var(--agline);border-radius:4px;padding:10px 12px}
  .aug .pl .nm{font-family:'Oswald','Arial Narrow',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--ag)}
  .aug .pl .nm .muted{font-family:var(--sans);text-transform:none;letter-spacing:0}
  .aug .pl .tot{font-family:'Oswald','Arial Narrow',sans-serif;font-size:14px;letter-spacing:.3px}
  .aug .ctl button{border-radius:4px;border:1px solid var(--agline);background:#fff;color:var(--ag);font-family:'Oswald','Arial Narrow',sans-serif}
  .aug .ctl .val{border:0;background:transparent}
  .aug .ctl .val b{font-family:'Oswald','Arial Narrow',sans-serif;font-weight:600;font-size:36px;color:#1b1d1c}
  .aug .ctl .val span{font-family:'Oswald','Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.6px;font-size:11.5px}
  .aug .ctl .val.emp b{text-transform:uppercase;letter-spacing:.6px;font-size:15px;color:var(--light)}
  .aug .ctl .pick.on{background:#fff1ee;border-color:#f3c2b8;color:var(--agred)}
  .aug .nav .btn{border-radius:4px;font-family:'Oswald','Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:1px;box-shadow:none;font-weight:500}
  .aug .nav .btn:not(.light){background:var(--ag)}
  .aug .nav .btn.light{border:2px solid var(--agline);color:var(--ag)}
  /* Augusta style leader board */
  .board{--ag:#006747;--agred:#c8102e;margin:6px 0 8px;font-family:'Oswald','Arial Narrow',sans-serif}
  .board-title{width:62%;margin:0 auto;background:#fff;border:2px solid #d9dfdb;border-bottom:0;border-radius:60px 60px 0 0/22px 22px 0 0;
       text-align:center;font-weight:700;font-size:20px;letter-spacing:1.5px;color:#1b1d1c;padding:4px 0 2px}
  .bw{background:#fff;border:2px solid #d9dfdb;border-radius:4px;overflow-x:auto;padding:4px}
  .lboard{border-collapse:separate;border-spacing:2px;font-size:15px;font-weight:600}
  .lboard th,.lboard td{min-width:24px;height:26px;padding:0 3px;text-align:center;background:#fff;border:1px solid #dfe5e1;color:var(--ag)}
  .lboard thead th{color:#1b1d1c;font-weight:600}
  .lboard .par td,.lboard .par th{color:#1b1d1c}
  .lboard .nm{min-width:96px;max-width:120px;text-align:left;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
       color:var(--ag);font-weight:600;letter-spacing:.5px;position:sticky;left:30px;z-index:1}
  .lboard thead .nm{color:#1b1d1c}
  .lboard .pos{min-width:24px;color:var(--agred);position:sticky;left:0;z-index:1}
  .lboard td.under{color:var(--ag)}
  .lboard td.even{color:#1b1d1c}
  .lboard td.over{color:var(--agred)}
  .lboard td.pu{color:#8a929a}
  .lboard .tot{min-width:52px;font-size:13px;letter-spacing:.5px}
  .lboard td{position:relative;height:32px;min-width:28px}
  .lboard .s{width:24px;height:24px;font-size:14px;font-weight:600}
  .lboard .dots{position:absolute;left:0;right:0;bottom:2px;font-style:normal;font-size:9px;line-height:8px;color:#8a929a;letter-spacing:-1px}
  /* score cells keep a strip at the bottom for the handicap dots, so they never touch the marks */
  .lboard .pl-row td{height:44px;padding:3px 4px 12px;min-width:32px}
  .lboard .pl-row td.nm,.lboard .pl-row td.pos,.lboard .pl-row td.tot{padding-bottom:3px}
  .lboard .sub{background:#f3f6f4;color:#1b1d1c;font-size:13px}
  .lboard thead .sub{color:#1b1d1c}
  .lboard .hcp td,.lboard .hcp th{color:var(--mid);font-weight:500;font-size:13px}
  .lboard .pts-row td{height:22px;font-size:12px;color:var(--mid);font-weight:500}
  .lboard .pts-row .nm{font-size:11px;color:var(--mid)}
  .board-legend{--ag:#006747;--agred:#c8102e;font-family:var(--sans)}
  .board-legend .under{color:var(--ag)} .board-legend .even{color:#1b1d1c} .board-legend .over{color:var(--agred)}
  .board-legend .s.even{border:0}
  .board-legend .dots{font-style:normal;color:#8a929a}
  dialog{border:0;border-radius:18px;padding:0;box-shadow:0 30px 80px rgba(0,0,0,.35)}
  dialog::backdrop{background:rgba(8,30,23,.55);backdrop-filter:blur(3px)}
  .dlg{padding:20px 18px 18px}
  .dlg h3{font-family:var(--serif);font-weight:400;font-size:24px;margin:0 0 12px}
  .row2{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
  .row2 .btn{box-shadow:none}
  .btn.cancel{background:#eef0f2;color:var(--mid);box-shadow:none}
  .btn.go{background:var(--green);color:#fff}
  .hd-r{display:flex;align-items:center;gap:14px}
  .rnav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 12px}
  .rnav-l{display:flex;gap:8px;min-width:0}
  .pill{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 13px;
        font-size:13px;font-weight:500;color:var(--mid);text-decoration:none;white-space:nowrap;line-height:1.2;font-family:var(--sans)}
  .pill:active{background:#f3f6f4}
  #dset{width:min(460px,calc(100vw - 24px));max-height:calc(100vh - 40px);overflow-y:auto}
  .set-h{display:flex;justify-content:space-between;align-items:center}
  .set-h .x{border:0;background:none;font-size:26px;color:var(--light);padding:0 4px}

<script type="module">
// Scorecard for any round: up to four players, a course library with par and
// handicap index per hole, and three formats (stroke play, Stableford, match play).
// Shared through Firebase under the /golf node the ledger page already uses:
//   golf/courses/<id> = { name, region, holes: [{par, si}], created }
//   golf/people/<id>  = { name, hcp, created }   the player list; hcp is the current handicap
//   golf/rounds/<id>  = { created, date, course: {id, name, holes}, players: [{id, name, hcp}],
//                         format: "medal" | "stableford" | "match" | "sindicato", teams: [[0,1],[2,3]] | [[0],[1]],
//                         useHcp, scores: { <player>: { <hole index>: strokes | -1 (picked up) } } }
// The course and each player's handicap are copied into the round when it starts, so changing a
// course or a handicap later only affects rounds started after that.
// Open with ?demo for an in-memory copy with sample data (nothing is saved).
import { connect } from '../../queensland/firebase-config.js';

const DEMO = new URLSearchParams(location.search).has('demo');
const FORMAT = { medal: 'Juego por golpes', stableford: 'Stableford', match: 'Match play', sindicato: 'Sindicato' };
const app = document.getElementById('app');
const S = { courses: {}, rounds: {}, people: {}, loaded: false };
const peopleList = () => Object.entries(S.people).map(([id, p]) => ({ id, ...p })).sort((a, b) => a.name.localeCompare(b.name, 'es'));
let store = null;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const norm = t => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
const fmtDate = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const signed = v => v === 0 ? 'par' : v > 0 ? '+' + v : '−' + (-v);
const sum = a => a.reduce((x, y) => x + y, 0);

// ---------- storage: Firebase, or an in-memory copy for ?demo ----------
function memoryStore(root) {
  const subs = [];
  const get = p => p.split('/').reduce((o, k) => o == null ? undefined : o[k], root);
  const put = (p, v) => {
    const ks = p.split('/'); let o = root;
    for (const k of ks.slice(0, -1)) o = (o[k] ??= {});
    if (v === null) delete o[ks.at(-1)]; else o[ks.at(-1)] = structuredClone(v);
  };
  return {
    on(p, cb) { subs.push({ p, cb }); cb(structuredClone(get(p) ?? null)); },
    async set(p, v) { put(p, v); subs.forEach(s => s.cb(structuredClone(get(s.p) ?? null))); },
    key() { return 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  };
}
function fireStore(db, api) {
  return {
    on(p, cb, err) { api.onValue(api.ref(db, p), s => cb(s.val()), err); },
    set(p, v) { return api.set(api.ref(db, p), v); },
    key(p) { return api.push(api.ref(db, p)).key; }

}
async function save(path, value) {
  try { await store.set(path, value); return true; }
  catch (e) {
    const denied = /PERMISSION|DENIED/i.test((e && (e.code || e.message)) || '');
    toast(denied ? 'No se ha guardado: la base de datos lo ha rechazado.' : 'No se ha guardado: sin conexión. Vuelve a intentarlo.');
    return false;
  }
}
function toast(msg) {
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 4500);
}

// ---------- golf maths ----------
const holesOf = r => r.course.holes;
const scoreOf = (r, p, i) => { const v = r.scores?.[p]?.[i]; return v == null ? null : v; };
const inMatch = r => r.format === 'match' ? r.teams.flat() : r.players.map((_, i) => i);

// Handicap used in this round: half for a 9-hole round on an 18-hole course.
const phcp = (r, p) => { const h = +r.players[p].hcp || 0; return Math.round(r.half ? h / 2 : h); };
// The hole number on the course card (a 9-hole round on the back nine keeps holes 10 to 18).
const holeNo = (r, i) => holesOf(r)[i].no || i + 1;
const hcpLabel = (r, p) => `hcp ${r.players[p].hcp}${r.half ? ` (${phcp(r, p)} en 9 hoyos)` : ''}`;
// Handicap strokes a player receives on a hole, from the handicap index (si) of that hole.
// Match play and Sindicato give the difference to the lowest handicap; the others use the full handicap.
function received(r, p, i) {
  if (!r.useHcp) return 0;
  const hs = holesOf(r), n = hs.length;
  let h = phcp(r, p);
  if (r.format === 'match' || r.format === 'sindicato') h -= Math.min(...inMatch(r).map(q => phcp(r, q)));
  h = Math.max(0, Math.round(h));
  const si = hs[i].si || i + 1;
  return Math.floor(h / n) + (si <= h % n ? 1 : 0);
}
function stbPoints(r, p, i) {
  const s = scoreOf(r, p, i);
  if (s === null) return null;
  if (s < 0) return 0;
  return Math.max(0, 2 + holesOf(r)[i].par + received(r, p, i) - s);
}
// Sindicato, three players: 6 points per hole on net score. 4-2-0 when all differ, 4-1-1 when one wins
// and the other two tie, 3-3-0 when two tie for best, 2-2-2 when all three tie. A pick-up is the worst score.
// How a player is doing against their own handicap, whether or not the round is scored with handicap:
// strokes over par on the holes played so far, minus the handicap strokes those holes carry
// (full handicap, halved in a 9-hole round, given by the hole index). Picked-up holes are left out.
function vsHandicap(r, p) {
  const hs = holesOf(r), n = hs.length, h = Math.max(0, phcp(r, p));
  let v = 0, played = 0;
  hs.forEach((hole, i) => {
    const s = scoreOf(r, p, i);
    if (!(s > 0)) return;
    const si = hole.si || i + 1;
    v += s - hole.par - (Math.floor(h / n) + (si <= h % n ? 1 : 0));
    played++;
  });
  return played ? v : null;
}
const vsHcpLabel = v => v === null ? '' : `${v > 0 ? '+' + v : v < 0 ? '−' + (-v) : '0'} vs hándicap`;
function sindPoints(r, i) {
  if (r.players.some((_, p) => scoreOf(r, p, i) === null)) return null;
  const net = r.players.map((_, p) => { const s = scoreOf(r, p, i); return s > 0 ? s - received(r, p, i) : Infinity; });
  const best = Math.min(...net), worst = Math.max(...net);
  const nBest = net.filter(v => v === best).length, nWorst = net.filter(v => v === worst).length;
  if (nBest === 3) return [2, 2, 2];
  if (nBest === 2) return net.map(v => v === best ? 3 : 0);
  if (nWorst === 2) return net.map(v => v === best ? 4 : 1);
  return net.map(v => v === best ? 4 : v === worst ? 0 : 2);
}
const isPts = r => r.format === 'stableford' || r.format === 'sindicato';
const holePts = (r, p, i) => r.format === 'stableford' ? stbPoints(r, p, i) : r.format === 'sindicato' ? (sindPoints(r, i)?.[p] ?? null) : null;
const ptsWord = n => n === 1 ? 'pt' : 'pts';
function playerStats(r, p) {
  const hs = holesOf(r);
  let gross = 0, par = 0, played = 0, entered = 0, pu = 0, pts = 0;
  hs.forEach((h, i) => {
    const s = scoreOf(r, p, i);
    if (s === null) return;
    entered++;
    pts += holePts(r, p, i) || 0;
    if (s < 0) { pu++; return; }
    gross += s; par += h.par; played++;
  });
  const hcp = r.useHcp ? phcp(r, p) : 0;
  return { gross, vsPar: gross - par, played, entered, pu, pts, complete: played === hs.length,
           net: played === hs.length ? gross - hcp : null, netVsPar: gross - par - hcp };
}
// Better ball: each side's best net score on the hole. Decided once everyone in the match has an entry.
// Each side's net scores on the hole, best first. A picked-up ball counts as no score.
const teamNets = (r, t, i) => r.teams[t].map(p => {
  const s = scoreOf(r, p, i);
  return s > 0 ? s - received(r, p, i) : Infinity;
}).sort((a, b) => a - b);
// With "desempata la mala" (r.worst), a tie on the best balls goes to the side with the better second ball.
function holeWinner(r, i) {
  if (inMatch(r).some(p => scoreOf(r, p, i) === null)) return null;
  const [a, b] = [teamNets(r, 0, i), teamNets(r, 1, i)];
  if (a[0] !== b[0]) return a[0] < b[0] ? 0 : 1;
  if (r.worst && a.length === 2 && a[1] !== b[1]) return a[1] < b[1] ? 0 : 1;
  return 'h';
}
const wonByWorst = (r, i) => r.worst && holeWinner(r, i) !== 'h' && holeWinner(r, i) !== null && teamNets(r, 0, i)[0] === teamNets(r, 1, i)[0];
const matchNote = r => (r.useHcp ? ' · con hándicap' : '') + (r.worst ? ' · desempata la mala' : '');
const firstName = n => String(n || '').trim().split(/\s+/)[0];
// Pairs in match play get a team name, picked at random when the round starts and saved with it
// (r.teamNames). Rounds from before that get a fixed pair from the list, based on when they started.
const TEAM_NAMES = ['Los Birdies', 'Bogey Boys', 'Los Eagles', 'Los Albatros', 'Los Topos', 'Los del Rough',
  'Bunker Brothers', 'Los Hierros', 'Green Machine', 'Los Putts Locos', 'Fairway Fighters', 'Los Chipeadores',
  'Los Mulligans', 'Club Sandwich', 'Hoyo en Uno', 'Los Caddies', 'Tee Time', 'Los del Hoyo 19', 'Los Dormies',
  'Los Wedges', 'Sand Save', 'Los Divots', 'Backspin', 'Los del Lago', 'Las Maderas', 'Los Scratch',
  'Los Bandidos del Hándicap', 'Los Salvapares', 'Los Greenkeepers', 'Los Fore', 'Los Hook', 'Slice Squad'];
const pickTeamNames = () => { const a = Math.floor(Math.random() * TEAM_NAMES.length);
  let b = Math.floor(Math.random() * (TEAM_NAMES.length - 1)); if (b >= a) b++; return [TEAM_NAMES[a], TEAM_NAMES[b]]; };
const members = (r, t) => r.teams[t].map(p => firstName(r.players[p].name)).join(' y ');
function teamName(r, t) {
  if (r.teams[t].length === 1) return members(r, t);

function parse() {

// ---------- new round ----------
let draft = null, lastCourse = null;
const emptyRow = () => ({ id: null, name: '', hcp: '' });
const personRow = id => ({ id, name: S.people[id].name, hcp: S.people[id].hcp ?? 0 });
function newDraft() {
  const ids = coursesByRegion().flatMap(([, list]) => list.map(([id]) => id));
  // Start from the players of the most recent round, with their current handicaps.
  const last = Object.values(S.rounds).sort((a, b) => (b.created || 0) - (a.created || 0))[0];
  const rows = (last?.players || []).filter(p => p.id && S.people[p.id]).map(p => personRow(p.id));
  return { courseId: lastCourse && S.courses[lastCourse] ? lastCourse : ids[0], date: today(),
           players: rows.concat(Array.from({ length: Math.max(0, 2 - rows.length) }, emptyRow)),
           format: 'stableford', useHcp: true, start: 0, nine: false, worst: false, teamNames: pickTeamNames(), err: '' };
}
function vSetup() {
  if (!draft) draft = newDraft();
  const d = draft, np = d.players.length;
  const matchOk = np === 2 || np === 4, sindOk = np === 3;
  if (d.format === 'match' && !matchOk) d.format = 'stableford';
  if (d.format === 'sindicato' && !sindOk) d.format = 'stableford';
  const courses = Object.entries(S.courses).sort((a, b) => a[1].name.localeCompare(b[1].name));
  const teams4 = d.format === 'match' && np === 4;
  const prow = i => { const p = d.players[i]; return `
        <div class="prow">
          <div class="pick-wrap"><input data-pn="${i}" value="${esc(p.name)}" maxlength="24" placeholder="Busca o escribe un nombre" autocomplete="off"
               class="${p.id ? 'ok' : ''}" aria-label="Jugador ${i + 1}"><div class="sug" data-sug="${i}" hidden></div></div>
          <input data-ph="${i}" value="${esc(p.hcp)}" type="number" inputmode="decimal" step="0.1" min="0" max="54" placeholder="hcp" aria-label="Hándicap del jugador ${i + 1}">
          ${np > 2 ? `<button class="x" data-rm="${i}" aria-label="Quitar jugador">×</button>` : '<span></span>'}
        </div>`; };
  app.innerHTML = `
    <a class="back" href="#/">‹ Partidas</a>
    <h1>Nueva partida</h1>
    ${d.err ? `<div class="err">${esc(d.err)}</div>` : ''}
    <div class="f"><label for="scs">Campo</label>
      <div class="pick-wrap"><input id="scs" value="${esc(S.courses[d.courseId]?.name || '')}" class="${S.courses[d.courseId] ? 'ok' : ''}"
           placeholder="Busca un campo o una zona" autocomplete="off" maxlength="50"><div class="sug wide" id="csug" hidden></div></div>
      <div class="hint">${S.courses[d.courseId] ? `${esc(S.courses[d.courseId].region || 'Otros')} · ${S.courses[d.courseId].holes.length} hoyos · par ${sum(S.courses[d.courseId].holes.map(h => h.par))} · ` : ''}<a href="#/campo/nuevo">Añadir otro campo</a></div></div>
    ${S.courses[d.courseId]?.holes.length === 18 ? `
    <div class="f"><div class="lab">Hoyos</div>
      <div class="seg"><button data-nine="0" class="${d.nine ? '' : 'on'}">18 hoyos</button><button data-nine="1" class="${d.nine ? 'on' : ''}">9 hoyos</button></div></div>

async function startRound() {
  const d = draft;
  const c = S.courses[d.courseId];
  if (!c) { d.err = 'Elige un campo.'; return render(); }
  const missing = d.players.find(p => !p.id || !S.people[p.id]);
  if (missing) {
    d.err = missing.name.trim() ? `Elige a «${missing.name.trim()}» de la lista o añádelo como jugador nuevo.` : 'Falta un jugador: escribe su nombre o quita la fila.';
    return render();
  }
  // The handicap is copied from the player's record now and never updated in this round afterwards.
  const players = d.players.map(p => ({ id: p.id, name: S.people[p.id].name, hcp: Math.max(0, Math.min(54, +S.people[p.id].hcp || 0)) }));
  const teams = d.format === 'match' ? (players.length === 4 ? [[0, 1], [2, 3]] : [[0], [1]]) : null;
  // A 9-hole round on an 18-hole course copies only that nine. The handicap index is re-ranked 1 to 9
  // within the nine (the card's value is kept in sio for display) and handicaps are halved (r.half).
  const nine = c.holes.length === 18 && d.nine;
  let holes = c.holes;
  if (nine) {
    holes = c.holes.slice(d.start, d.start + 9).map((h, k) => ({ ...h, no: d.start + k + 1 }));
    if (holes.every(h => h.si)) {
      const rank = [...holes].sort((a, b) => a.si - b.si);
      holes = holes.map(h => ({ ...h, sio: h.si, si: rank.indexOf(h) + 1 }));
    }
  }
  const r = { created: Date.now(), date: d.date || today(), course: { id: d.courseId, name: c.name, holes },
              players, format: d.format, useHcp: !!d.useHcp, start: c.holes.length === 18 && !nine ? d.start : 0 };
  if (nine) r.half = true;
  if (teams) r.teams = teams;
  if (teams && teams[0].length === 2) r.teamNames = [...draft.teamNames];
  if (teams && teams[0].length === 2) r.worst = !!d.worst;
  const id = store.key('golf/rounds');
  lastCourse = d.courseId;
  if (await save('golf/rounds/' + id, r)) { draft = null; go('#/r/' + id + '/' + (r.start + 1)); }
}

// Suggestions under a player's name field: matching players not already in the round,
// plus an option to create a new player when the typed name does not exist yet.
function suggest(i) {
  const input = document.querySelector(`[data-pn="${i}"]`), box = document.querySelector(`[data-sug="${i}"]`);
  if (!input || !box) return;
  const q = norm(input.value);
  const taken = new Set(draft.players.map((p, k) => k !== i && p.id).filter(Boolean));
  const all = peopleList();
  const list = all.filter(p => !taken.has(p.id) && (!q || norm(p.name).includes(q))).slice(0, 6);
  const exists = all.find(p => norm(p.name) === q);
  let html = list.map(p => `<button type="button" data-pickp="${i}" data-pid="${esc(p.id)}"><span>${esc(p.name)}</span><span class="muted">hcp ${esc(p.hcp ?? 0)}</span></button>`).join('');
  if (q && !exists) html += `<button type="button" class="new" data-newp="${i}">+ Añadir «${esc(input.value.trim())}» como jugador nuevo</button>`;
  if (!html && !q) html = '<div class="none">Escribe el nombre para añadir el primer jugador.</div>';
  box.innerHTML = html;
  box.hidden = !html || document.activeElement !== input;
}
// Course search: matches on course or region name, grouped by region like the course list.
function suggestCourse(showAll) {
  const input = document.getElementById('scs'), box = document.getElementById('csug');
  if (!input || !box) return;
  const q = showAll ? '' : norm(input.value);
  const groups = coursesByRegion().map(([region, list]) => [region, list.filter(([, c]) => !q || norm(c.name).includes(q) || norm(region).includes(q))])

  let html = groups.map(([region, list]) => `<div class="grp">${esc(region)}</div>` + list.map(([id, c]) =>
    `<button type="button" data-pickc="${esc(id)}" class="${id === draft.courseId ? 'cur' : ''}"><span>${esc(c.name)}</span><span class="muted">par ${sum(c.holes.map(h => h.par))}</span></button>`).join('')).join('');
  if (q) html += `<button type="button" class="new" data-newc>+ Añadir «${esc(input.value.trim())}» como campo nuevo</button>`;
  box.innerHTML = html || '<div class="none">No hay campos todavía.</div>';
  box.hidden = document.activeElement !== input;
}

async function saveCourse() {
  const d = cdraft, n = d.holes.length;
  const name = d.name.trim();
  if (!name) { d.err = 'Ponle un nombre al campo.'; return render(); }
  const sis = d.holes.map(h => +h.si || 0);
  const filled = sis.filter(Boolean);
  if (filled.length && (filled.length < n || new Set(filled).size !== n || filled.some(v => v < 1 || v > n))) {
    d.err = `El índice tiene que tener cada número del 1 al ${n} una sola vez, o dejarse vacío en todos los hoyos.`;
    return render();
  }
  const c = { ...(S.courses[d.id] || {}), name, region: (d.region || '').trim(),
              holes: d.holes.map((h, i) => filled.length ? { par: h.par, si: sis[i] } : { par: h.par }), created: S.courses[d.id]?.created || Date.now() };
  const id = d.id || store.key('golf/courses');
  if (await save('golf/courses/' + id, c)) {
    cdraft = null;
    if (draft) { draft.courseId = id; go('#/nueva'); } else go('#/campos');
  }
}

function setScore(k, delta) {
  const r = S.rounds[cur.id]; if (!r) return;
  const n = holesOf(r).length;
  const i = cur.hole === null || cur.hole < 0 || cur.hole >= n ? firstOpen(r) : cur.hole;
  const par = holesOf(r)[i].par, s = scoreOf(r, k, i);
  let v;
  if (delta === 'set') v = s === null || s < 0 ? par : s;
  else if (delta === 'pick') v = s !== null && s < 0 ? null : -1;
  else if (s === null || s < 0) v = delta > 0 ? par : par - 1;
  else v = s + delta;
  if (v !== null && v !== -1 && v < 1) v = null;
  if (v !== null && v > 15) v = 15;
  if (cur.hole === null) go(`#/r/${cur.id}/${i + 1}`);
  save(`golf/rounds/${cur.id}/scores/${k}/${i}`, v);
}

// ---------- full scorecard ----------
// The scorecard as an Augusta style board: one row per player, strokes on every hole with the usual
// marks (circle birdie, double circle eagle, box bogey, double box worse) coloured green under par,
// black at par and red over, dots for handicap strokes, and Ida, Vuelta and totals. Rows arrive ranked.
function leaderBoard(r, ranked) {
  const hs = holesOf(r), n = hs.length;
  const pos = [];
  const key = x => isPts(r) ? x.st.pts : x.st.vsPar;
  ranked.forEach((x, i) => pos.push(i && x.st.played && ranked[i - 1].st.played && key(x) === key(ranked[i - 1]) ? pos[i - 1] : i + 1));
  // columns: hole indexes, with 'ida' after the front nine and 'vta' after the back on 18 holes
  const cols = n === 18 ? [...hs.slice(0, 9).map((_, i) => i), 'ida', ...hs.slice(9).map((_, i) => i + 9), 'vta'] : hs.map((_, i) => i);
  const range = c => c === 'ida' ? [0, 9] : [9, 18];
  const colHead = c => typeof c === 'number' ? `<th>${holeNo(r, c)}</th>` : `<th class="sub">${c === 'ida' ? 'IDA' : 'VTA'}</th>`;

      <tr class="par"><th>Par</th>${idx.map(i => `<td>${hs[i].par}</td>`).join('')}<td class="sum">${sum(idx.map(i => hs[i].par))}</td></tr>

    if (t.id === 'cq') {
      const digits = t.value.replace(/[^3-6]/g, '').slice(0, cdraft.holes.length);
      [...digits].forEach((c, i) => cdraft.holes[i].par = +c);
      // repaint the par buttons without losing focus in this field
      document.querySelectorAll('[data-par]').forEach(b => { const p = cdraft.holes[+b.dataset.par].par; b.textContent = p; b.className = 'p' + p; });
      const pars = cdraft.holes.map(h => h.par), n = pars.length;
      document.querySelector('.ptot').innerHTML = `Par ${n === 18 ? `ida ${sum(pars.slice(0, 9))}, vuelta ${sum(pars.slice(9))}, total ` : ''}<b>${sum(pars)}</b>`;
    }
  }
});
app.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'cby') setMe(t.value);
  if (cur.v === 'setup') {
    if (t.dataset.ph !== undefined) {
      const row = draft.players[+t.dataset.ph];
      if (row.id && t.value !== '') save(`golf/people/${row.id}/hcp`, Math.max(0, Math.min(54, +t.value)));
    }
    if (t.id === 'suh') { draft.useHcp = t.checked; render(); }
    if (t.id === 'sworst') draft.worst = t.checked;
  }
  if (cur.v === 'people') {
    const id = t.dataset.pid;
    if (id && t.dataset.f === 'hcp' && t.value !== '') save(`golf/people/${id}/hcp`, Math.max(0, Math.min(54, +t.value)));
    if (id && t.dataset.f === 'name' && t.value.trim()) save(`golf/people/${id}/name`, t.value.trim());
  }
});
app.addEventListener('focusin', ev => { if (ev.target.id === 'ctext') keepFocus = true; });
app.addEventListener('focusout', ev => { if (ev.target.id === 'ctext') setTimeout(() => { if (document.activeElement?.id !== 'ctext') keepFocus = false; }, 0); });
app.addEventListener('focusin', ev => {
  if (cur.v === 'setup' && ev.target.dataset.pn !== undefined) suggest(+ev.target.dataset.pn);
  // Focusing the course field shows every course; typing replaces the current name and filters.
  if (cur.v === 'setup' && ev.target.id === 'scs') { ev.target.select(); suggestCourse(true); }
});
app.addEventListener('focusout', ev => {
  const i = ev.target.dataset?.pn;
  if (cur.v === 'setup' && i !== undefined) setTimeout(() => { const b = document.querySelector(`[data-sug="${i}"]`); if (b) b.hidden = true; }, 200);
  // Leaving the course field without picking puts the chosen course's name back.
  if (cur.v === 'setup' && ev.target.id === 'scs') setTimeout(() => {
    const b = document.getElementById('csug'), inp = document.getElementById('scs');
    if (b) b.hidden = true;
    if (inp && document.activeElement !== inp) { inp.value = S.courses[draft.courseId]?.name || ''; inp.classList.toggle('ok', !!S.courses[draft.courseId]); }
  }, 200);
});
// Keep focus in the name field while a suggestion is being picked with a mouse.
app.addEventListener('mousedown', ev => { if (ev.target.closest('.sug')) ev.preventDefault(); });

// ---------- boot ----------
function conn(label, kind) { const c = document.getElementById('conn'); c.textContent = label; c.className = 'conn ' + kind; }
function listen() {
  let got = 0;
  // First full load always renders; later updates skip the forms so typing is not interrupted.
  const done = () => { if (++got === 3) { S.loaded = true; render(); return true; } return got < 3; };
  const onErr = err => {
    conn('desconectado', 'down');
    toast(/PERMISSION|DENIED/i.test(err?.code || err?.message || '') ? 'La base de datos no deja leer /golf.' : 'Se ha perdido la conexión.');
  };
  store.on('golf/courses', v => { S.courses = v || {}; if (!done() && cur.v !== 'course') render(); }, onErr);
  store.on('golf/rounds', v => { S.rounds = v || {}; if (!done() && cur.v !== 'setup' && cur.v !== 'course') render(); }, onErr);
  store.on('golf/people', v => { S.people = v || {}; if (!done() && cur.v !== 'setup' && cur.v !== 'people') render(); }, onErr);
}

render();
if (DEMO) {
  const pars = [4, 4, 3, 5, 4, 4, 3, 5, 4, 4, 5, 3, 4, 4, 3, 4, 5, 4];
  const sis = [7, 11, 17, 1, 9, 5, 15, 3, 13, 8, 2, 16, 12, 6, 18, 10, 4, 14];
  const holes = pars.map((par, i) => ({ par, si: sis[i] }));
  const sc = [[5, 4, 3, 6, 5, 4, 4, 5, 5, 4, 6], [4, 5, 4, 5, 4, 5, 3, 6, 4, 5, 5], [6, 5, 3, 7, 5, 5, 4, 6, 5, 5, 6], [5, 4, 4, 5, 4, 4, 3, 5, 5, 4, 5]];
  const toObj = a => Object.fromEntries(a.map((v, i) => [i, v]));
  store = memoryStore({ golf: {
    people: { p1: { name: 'Javi', hcp: 18 }, p2: { name: 'Hugo', hcp: 14 }, p3: { name: 'Ana', hcp: 24 }, p4: { name: 'Luis', hcp: 10 } },
    courses: { c1: { name: 'Campo de ejemplo', holes, created: 1 } },
    rounds: {
      r1: { created: 2, date: today(), course: { id: 'c1', name: 'Campo de ejemplo', holes },
            players: [{ id: 'p1', name: 'Javi', hcp: 18 }, { id: 'p2', name: 'Hugo', hcp: 14 }, { id: 'p3', name: 'Ana', hcp: 24 }, { id: 'p4', name: 'Luis', hcp: 10 }],
            format: 'stableford', useHcp: true, scores: toObj(sc.map(toObj)) },
      r2: { created: 1, date: '2026-09-20', course: { id: 'c1', name: 'Campo de ejemplo', holes },
            players: [{ id: 'p1', name: 'Javi', hcp: 18 }, { id: 'p2', name: 'Hugo', hcp: 14 }, { id: 'p3', name: 'Ana', hcp: 24 }, { id: 'p4', name: 'Luis', hcp: 10 }],
            format: 'match', teams: [[0, 2], [1, 3]], useHcp: true, scores: toObj(sc.map(toObj)) },
      r3: { created: 0, date: '2026-09-13', course: { id: 'c1', name: 'Campo de ejemplo', holes },
            players: [{ id: 'p1', name: 'Javi', hcp: 18 }, { id: 'p2', name: 'Hugo', hcp: 14 }],
            format: 'stableford', useHcp: true, scores: toObj([pars.map((x, i) => x + (i % 3 ? 1 : 0)), pars.map((x, i) => x + (i % 2))].map(toObj)) },
    } } });
  conn('demo, no se guarda', 'down');
  listen();
} else {
  const c = await connect();
  if (!c) { conn('sin conexión', 'down'); app.innerHTML = '<div class="empty">No se puede conectar con la base de datos.</div>'; }
  else { store = fireStore(c.db, c.api); conn('en directo', 'live'); listen(); }
}
</script>
</body>
