<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>arbici</title>
<style>
  :root{ color-scheme: light;
    --ink:#14181b; --mid:#59626a; --light:#8a929a; --line:#e3e7ea;
    --paper:#fff; --wash:#f6f5f2; --go:#0f7a6e; --gobg:#eef7f5;
    --serif:'Iowan Old Style',Palatino,Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--wash);color:var(--ink);font-family:var(--sans);
       font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
  .page{max-width:620px;margin:0 auto;padding:14vh 22px 80px}
  h1{font-family:var(--serif);font-weight:400;font-size:34px;margin:0 0 8px;letter-spacing:-.5px}
  .sub{color:var(--mid);margin:0 0 44px}
  h2{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--light);
     margin:0 0 12px;font-weight:600}
  ul{list-style:none;margin:0;padding:0}
  li{margin:0 0 2px}
  a.card{display:block;text-decoration:none;color:inherit;background:var(--paper);
         border:1px solid var(--line);border-radius:7px;padding:15px 18px;margin:0 0 10px;
         transition:border-color .15s, transform .15s}
  a.card:hover{border-color:#bcd6d0;transform:translateY(-1px)}
  a.card b{display:block;font-weight:600;font-size:16px;color:var(--go)}
  a.card span{display:block;color:var(--mid);font-size:13.8px;margin-top:3px}
  footer{margin-top:64px;padding-top:18px;border-top:1px solid var(--line);
         font-size:12px;color:var(--light)}
</style>
</head>
<body>
<div class="page">

  <h1>arbici</h1>
  <p class="sub">A place to put things.</p>

  <h2>Pages</h2>
  <ul>
    <li>
      <a class="card" href="./queensland/">
        <b>Queensland, October 2026</b>
        <span>Travel guide and booking plan. Cairns to the Whitsundays, then Earth Frequency.</span>
      </a>
    </li>
    <li>
      <a class="card" href="./golf/">
        <b>The Ledger</b>
        <span>Golf rounds, who is winning, and who owes whom.</span>
      </a>
    </li>

    <!--
      To add another page:
      1. Make a new folder next to /queensland, e.g. /barcelona
      2. Put an index.html inside it
      3. Copy the <li> block above, change the href, title and description
      It will be live at  <your-username>.github.io/barcelona/
    -->
  </ul>

  <footer>Hosted on GitHub Pages.</footer>

</div>
</body>
</html>
